<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@600;700;800&display=swap" rel="stylesheet">
</helmet>

<div style="font-family:'Figtree',sans-serif; background:oklch(0.975 0.008 70); color:oklch(0.22 0.02 60); min-height:100vh; padding:56px; box-sizing:border-box;">
  <div style="max-width:960px; margin:0 auto;">

    <div style="font-size:13px; font-weight:700; letter-spacing:0.08em; text-transform:uppercase; color:oklch(0.6 0.14 45); margin-bottom:32px;">CareHub · Logo mark</div>

    <!-- PRIMARY LOCKUP -->
    <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:16px; padding:56px; display:flex; align-items:center; justify-content:center; margin-bottom:20px;">
      <div style="display:flex; align-items:center; gap:18px;">
        <div style="position:relative; width:56px; height:56px; flex-shrink:0;">
          <div style="position:absolute; left:14px; top:-5px; width:5px; height:11px; border-radius:2px; background:oklch(0.55 0.09 130);"></div>
          <div style="position:absolute; left:37px; top:-5px; width:5px; height:11px; border-radius:2px; background:oklch(0.55 0.09 130);"></div>
          <div style="position:absolute; inset:0; border-radius:14px; background:oklch(0.99 0.006 70); border:2.5px solid oklch(0.6 0.14 45);"></div>
          <div style="position:absolute; left:2.5px; right:2.5px; top:2.5px; height:15px; border-radius:11px 11px 0 0; background:oklch(0.6 0.14 45);"></div>
          <div style="position:absolute; left:50%; top:34px; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:oklch(0.55 0.09 130);"></div>
        </div>
        <div style="font-size:34px; font-weight:800; letter-spacing:-0.01em;">CareHub</div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr; gap:20px; margin-bottom:20px;">
      <!-- STACKED -->
      <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:16px; padding:48px; display:flex; align-items:center; justify-content:center;">
        <div style="display:flex; flex-direction:column; align-items:center; gap:14px;">
          <div style="position:relative; width:56px; height:56px; flex-shrink:0;">
            <div style="position:absolute; left:14px; top:-5px; width:5px; height:11px; border-radius:2px; background:oklch(0.55 0.09 130);"></div>
            <div style="position:absolute; left:37px; top:-5px; width:5px; height:11px; border-radius:2px; background:oklch(0.55 0.09 130);"></div>
            <div style="position:absolute; inset:0; border-radius:14px; background:oklch(0.99 0.006 70); border:2.5px solid oklch(0.6 0.14 45);"></div>
            <div style="position:absolute; left:2.5px; right:2.5px; top:2.5px; height:15px; border-radius:11px 11px 0 0; background:oklch(0.6 0.14 45);"></div>
            <div style="position:absolute; left:50%; top:34px; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:oklch(0.55 0.09 130);"></div>
          </div>
          <div style="font-size:20px; font-weight:800; letter-spacing:-0.01em;">CareHub</div>
        </div>
      </div>

      <!-- ON DARK -->
      <div style="background:oklch(0.22 0.02 60); border-radius:16px; padding:48px; display:flex; align-items:center; justify-content:center;">
        <div style="display:flex; align-items:center; gap:16px;">
          <div style="position:relative; width:48px; height:48px; flex-shrink:0;">
            <div style="position:absolute; left:12px; top:-4px; width:4.5px; height:9px; border-radius:2px; background:oklch(0.68 0.09 130);"></div>
            <div style="position:absolute; left:31.5px; top:-4px; width:4.5px; height:9px; border-radius:2px; background:oklch(0.68 0.09 130);"></div>
            <div style="position:absolute; inset:0; border-radius:12px; background:oklch(0.22 0.02 60); border:2.5px solid oklch(0.7 0.14 45);"></div>
            <div style="position:absolute; left:2.5px; right:2.5px; top:2.5px; height:13px; border-radius:9.5px 9.5px 0 0; background:oklch(0.7 0.14 45);"></div>
            <div style="position:absolute; left:50%; top:29px; transform:translateX(-50%); width:13px; height:13px; border-radius:50%; background:oklch(0.68 0.09 130);"></div>
          </div>
          <div style="font-size:24px; font-weight:800; color:oklch(0.99 0.006 70); letter-spacing:-0.01em;">CareHub</div>
        </div>
      </div>
    </div>

    <div style="display:grid; grid-template-columns:1fr 1fr 1fr; gap:20px; margin-bottom:20px;">
      <!-- APP ICON -->
      <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:16px; padding:36px; display:flex; align-items:center; justify-content:center;">
        <div style="width:96px; height:96px; border-radius:24px; background:oklch(0.6 0.14 45); position:relative;">
          <div style="position:absolute; left:26px; top:-6px; width:8px; height:16px; border-radius:3px; background:oklch(0.99 0.006 70); opacity:0.9;"></div>
          <div style="position:absolute; left:62px; top:-6px; width:8px; height:16px; border-radius:3px; background:oklch(0.99 0.006 70); opacity:0.9;"></div>
          <div style="position:absolute; left:8px; right:8px; top:8px; height:22px; border-radius:9px 9px 0 0; background:oklch(0.7 0.13 45);"></div>
          <div style="position:absolute; left:50%; top:52px; transform:translateX(-50%); width:24px; height:24px; border-radius:50%; background:oklch(0.99 0.006 70);"></div>
        </div>
      </div>

      <!-- MONOCHROME -->
      <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:16px; padding:36px; display:flex; align-items:center; justify-content:center;">
        <div style="position:relative; width:56px; height:56px;">
          <div style="position:absolute; left:14px; top:-5px; width:5px; height:11px; border-radius:2px; background:oklch(0.22 0.02 60);"></div>
          <div style="position:absolute; left:37px; top:-5px; width:5px; height:11px; border-radius:2px; background:oklch(0.22 0.02 60);"></div>
          <div style="position:absolute; inset:0; border-radius:14px; border:2.5px solid oklch(0.22 0.02 60);"></div>
          <div style="position:absolute; left:50%; top:34px; transform:translateX(-50%); width:15px; height:15px; border-radius:50%; background:oklch(0.22 0.02 60);"></div>
        </div>
      </div>

      <!-- SMALL SIZE TEST -->
      <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:16px; padding:36px; display:flex; align-items:center; justify-content:center; gap:10px;">
        <div style="position:relative; width:24px; height:24px; flex-shrink:0;">
          <div style="position:absolute; left:6px; top:-2px; width:2.5px; height:5px; border-radius:1px; background:oklch(0.55 0.09 130);"></div>
          <div style="position:absolute; left:15.5px; top:-2px; width:2.5px; height:5px; border-radius:1px; background:oklch(0.55 0.09 130);"></div>
          <div style="position:absolute; inset:0; border-radius:6px; background:oklch(0.99 0.006 70); border:1.5px solid oklch(0.6 0.14 45);"></div>
          <div style="position:absolute; left:1.5px; right:1.5px; top:1.5px; height:7px; border-radius:5px 5px 0 0; background:oklch(0.6 0.14 45);"></div>
          <div style="position:absolute; left:50%; top:14px; transform:translateX(-50%); width:7px; height:7px; border-radius:50%; background:oklch(0.55 0.09 130);"></div>
        </div>
        <div style="font-size:14px; font-weight:800;">CareHub</div>
      </div>
    </div>

    <div style="font-size:13.5px; line-height:1.6; color:oklch(0.48 0.02 60); max-width:640px;">A desk calendar with one date circled — the single place every appointment across every provider gets marked down, instead of living in five different clinic apps and paper cards.</div>
  </div>
</div>

</x-dc>
</body>
</html>
