<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin: 0; }
    a { color: oklch(0.55 0.12 260); text-decoration: none; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</helmet>

<div style="font-family:'Figtree',sans-serif; background:oklch(0.9 0.012 60); min-height:100vh; display:flex; align-items:flex-start; justify-content:center; padding:40px 20px; box-sizing:border-box;">
  <div style="width:100%; max-width:430px; height:min(860px, 82vh); background:oklch(0.975 0.008 70); border-radius:28px; overflow:hidden; position:relative; box-shadow:0 20px 50px oklch(0.3 0.02 60 / 0.25); display:flex; flex-direction:column;">

    <!-- HEADER -->
    <div style="display:flex; align-items:center; justify-content:space-between; padding:18px 20px 14px; flex-shrink:0;">
      <div style="display:flex; align-items:center; gap:8px; font-size:16px; font-weight:800; color:oklch(0.22 0.02 60);">
        <div style="position:relative; width:20px; height:20px; flex-shrink:0;">
        <div style="position:absolute; left:5px; top:-2px; width:2.2px; height:4.5px; border-radius:1px; background:oklch(0.55 0.09 130);"></div>
        <div style="position:absolute; left:13px; top:-2px; width:2.2px; height:4.5px; border-radius:1px; background:oklch(0.55 0.09 130);"></div>
        <div style="position:absolute; inset:0; border-radius:5px; background:oklch(0.99 0.006 70); border:1.5px solid oklch(0.6 0.14 45);"></div>
        <div style="position:absolute; left:1.5px; right:1.5px; top:1.5px; height:6px; border-radius:4px 4px 0 0; background:oklch(0.6 0.14 45);"></div>
        <div style="position:absolute; left:50%; top:11px; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:oklch(0.55 0.09 130);"></div>
      </div>
        CareHub
      </div>
      <div style="width:30px; height:30px; border-radius:50%; background:oklch(0.9 0.02 45); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:oklch(0.4 0.1 45);">AR</div>
    </div>

    <!-- CONTENT -->
    <div style="flex:1; overflow-y:auto; padding:6px 20px 20px;">
      <div style="font-size:12.5px; font-weight:700; letter-spacing:0.04em; text-transform:uppercase; color:oklch(0.48 0.02 60); margin-bottom:12px;">{{ contentLabel }}</div>
      <div style="display:flex; flex-direction:column; gap:10px;">
        <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:12px; padding:14px 16px;">
          <div style="font-size:14.5px; font-weight:700; margin-bottom:3px;">Physio · Sunway Medical</div>
          <div style="font-size:12.5px; color:oklch(0.48 0.02 60);">Today · 3:00 PM</div>
        </div>
        <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:12px; padding:14px 16px;">
          <div style="font-size:14.5px; font-weight:700; margin-bottom:3px;">Dentist · Dr. Farah</div>
          <div style="font-size:12.5px; color:oklch(0.48 0.02 60);">Tue, 21 Jul · 9:15 AM</div>
        </div>
        <div style="background:oklch(0.99 0.006 70); border:1px solid oklch(0.9 0.015 60); border-radius:12px; padding:14px 16px;">
          <div style="font-size:14.5px; font-weight:700; margin-bottom:3px;">Dr. Tan Wei Ming · Cardiology</div>
          <div style="font-size:12.5px; color:oklch(0.48 0.02 60);">Fri, 24 Jul · 2:00 PM</div>
        </div>
      </div>
    </div>

    <!-- BOTTOM NAV -->
    <div style="flex-shrink:0; display:flex; align-items:center; justify-content:space-around; padding:10px 8px calc(10px + env(safe-area-inset-bottom)); background:oklch(0.99 0.006 70); border-top:1px solid oklch(0.9 0.015 60);">

      <div onClick="{{ selectHome }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:56px;">
        <div style="position:relative; width:22px; height:22px;">
          <div style="position:absolute; inset:0; border-radius:6px; border:2px solid {{ homeColor }};"></div>
          <div style="position:absolute; left:1.5px; right:1.5px; top:1.5px; height:6px; border-radius:4px 4px 0 0; background:{{ homeColor }};"></div>
          <div style="position:absolute; left:50%; top:12px; transform:translateX(-50%); width:6px; height:6px; border-radius:50%; background:{{ homeColor }};"></div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:{{ homeColor }};">Home</div>
      </div>

      <div onClick="{{ selectUnits }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:56px;">
        <div style="position:relative; width:22px; height:18px;">
          <div style="position:absolute; left:0; top:0; width:15px; height:15px; border-radius:4px; border:2px solid {{ unitsColor }}; background:oklch(0.975 0.008 70);"></div>
          <div style="position:absolute; left:7px; top:3px; width:15px; height:15px; border-radius:4px; border:2px solid {{ unitsColor }};"></div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:{{ unitsColor }};">Units</div>
      </div>

      <div onClick="{{ selectBook }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:56px; margin-top:-22px;">
        <div style="width:48px; height:48px; border-radius:50%; background:oklch(0.6 0.14 45); display:flex; align-items:center; justify-content:center; box-shadow:0 6px 14px oklch(0.6 0.14 45 / 0.35);">
          <div style="position:relative; width:18px; height:18px;">
            <div style="position:absolute; left:50%; top:0; width:2.5px; height:18px; transform:translateX(-50%); border-radius:2px; background:oklch(0.99 0.006 70);"></div>
            <div style="position:absolute; top:50%; left:0; width:18px; height:2.5px; transform:translateY(-50%); border-radius:2px; background:oklch(0.99 0.006 70);"></div>
          </div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:oklch(0.6 0.14 45);">Book</div>
      </div>

      <div onClick="{{ selectNotifications }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:56px;">
        <div style="position:relative; width:20px; height:22px;">
          <div style="position:absolute; left:2px; top:1px; width:16px; height:16px; border-radius:9px 9px 3px 3px; border:2px solid {{ notifColor }};"></div>
          <div style="position:absolute; left:50%; bottom:0; width:6px; height:3px; transform:translateX(-50%); border-radius:0 0 3px 3px; background:{{ notifColor }};"></div>
          <sc-if value="{{ hasUnread }}" hint-placeholder-val="{{ true }}">
            <div style="position:absolute; right:0; top:0; width:7px; height:7px; border-radius:50%; background:oklch(0.53 0.17 25); border:1.5px solid oklch(0.99 0.006 70);"></div>
          </sc-if>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:{{ notifColor }};">Alerts</div>
      </div>

      <div onClick="{{ selectProfile }}" style="display:flex; flex-direction:column; align-items:center; gap:4px; cursor:pointer; width:56px;">
        <div style="position:relative; width:20px; height:20px;">
          <div style="position:absolute; left:50%; top:0; width:9px; height:9px; transform:translateX(-50%); border-radius:50%; border:2px solid {{ profileColor }};"></div>
          <div style="position:absolute; left:50%; bottom:0; width:18px; height:10px; transform:translateX(-50%); border-radius:9px 9px 0 0; border:2px solid {{ profileColor }}; border-bottom:none;"></div>
        </div>
        <div style="font-size:10.5px; font-weight:700; color:{{ profileColor }};">Profile</div>
      </div>

    </div>
  </div>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { active: 'home' };

  renderVals() {
    const s = this.state;
    const clay = 'oklch(0.6 0.14 45)';
    const muted = 'oklch(0.62 0.015 60)';
    const c = (key) => (s.active === key ? clay : muted);

    const labels = { home: 'Upcoming — next 14 days', units: 'Your care units', book: 'New appointment', notifications: 'Notifications', profile: 'Profile & settings' };

    return {
      homeColor: c('home'),
      unitsColor: c('units'),
      notifColor: c('notifications'),
      profileColor: c('profile'),
      hasUnread: true,
      contentLabel: labels[s.active] || labels.home,
      selectHome: () => this.setState({ active: 'home' }),
      selectUnits: () => this.setState({ active: 'units' }),
      selectBook: () => this.setState({ active: 'book' }),
      selectNotifications: () => this.setState({ active: 'notifications' }),
      selectProfile: () => this.setState({ active: 'profile' }),
    };
  }
}
</script>
</body>
</html>
